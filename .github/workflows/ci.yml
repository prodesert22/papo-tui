name: CI
run-name: >-
  ${{ github.event_name == 'pull_request' && format('CI for PR #{0}', github.event.pull_request.number) || format('CI on {0}', github.ref_name) }}
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      release:
        type: boolean
        default: false
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  TZ: UTC
  PAPO_TEST_REQUIRED: '1'
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.release }}
jobs:
  # Every job runs in one toolchain per system and architecture, named after the hash of its
  # inputs: an image on Linux, an archive of C:\papo-ci on Windows. It is built and published only
  # when that tag does not exist yet; tools/ci.py uses the same tag on a developer's machine.
  toolchain:
    if: ${{ !inputs.release || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    name: Toolchain (${{ matrix.platform }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - runner: windows-2025
            platform: windows
            arch: x86_64
          - runner: windows-11-arm
            platform: windows
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      # A pull request from a fork cannot publish; its jobs build the image themselves.
      - name: Publish the toolchain image when its inputs changed
        if: matrix.platform == 'linux' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          python3 tools/ci.py image --push
      # Only starts tools/ci.py; the toolchain brings the Python the jobs use.
      - uses: actions/setup-python@v5
        if: matrix.platform == 'windows'
        with:
          python-version: '3.13'
      - name: Publish the Windows toolchain when its inputs changed
        if: matrix.platform == 'windows' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: python tools/ci.py image --windows --push
  quality:
    needs: toolchain
    if: ${{ !inputs.release || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Toolchain image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          python3 tools/ci.py image
      # Formatting, lint, contract and distribution tests, workflow lint and, for a pull
      # request, the version change: tools/ci.py runs them together and reports each one.
      - name: Check independent quality gates concurrently
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: python3 tools/ci.py run quality
  build:
    needs: toolchain
    if: ${{ !inputs.release || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    name: Build (${{ matrix.platform }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - runner: windows-2025
            platform: windows
            arch: x86_64
          - runner: windows-11-arm
            platform: windows
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Linux tests run in the toolchain image, through the command a developer uses.
      - name: Toolchain image
        if: matrix.platform == 'linux' && !inputs.release
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          python3 tools/ci.py image
      - name: Build Linux Release
        if: matrix.platform == 'linux' && !inputs.release
        run: python3 tools/ci.py run linux-release --stage build
      - name: Test Linux Release
        if: matrix.platform == 'linux' && !inputs.release
        run: python3 tools/ci.py run linux-release --stage test
      # A release packages each distribution in its own container, started from the host.
      - uses: actions/setup-python@v5
        if: matrix.platform == 'linux' && inputs.release
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/ci-linux-py313.txt
      - name: Linux release environment
        if: matrix.platform == 'linux' && inputs.release
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-venv libarchive-tools
          python3 dist/ci_linux.py --prepare
          python3 -m venv build/test-env
          build/test-env/bin/pip install --require-hashes -r requirements/ci-linux-py313.txt
      - uses: actions/cache/restore@v4
        if: matrix.platform == 'linux' && inputs.release
        id: release-cache
        with:
          path: |
            build/release-tasks/*/source/build/source-cache
            build/release-tasks/*/source/build/resources
            build/release-tasks/*/source/build/release-deps
          key: release-native-v2-${{ matrix.arch }}-${{ hashFiles('dist/dependencies.json', 'dist/bootstrap.py', 'dist/voice_dependencies.py', 'dist/patches/**', 'dist/resources.json', 'tests/fixtures/resources.json') }}
          restore-keys: |
            release-native-v2-${{ matrix.arch }}-
      - uses: actions/cache/restore@v4
        if: matrix.platform == 'linux' && inputs.release
        id: flatpak-cache
        with:
          path: |
            ~/.local/share/flatpak
            build/release-tasks/flatpak/source/.flatpak-builder/downloads
          key: flatpak-${{ matrix.arch }}-26.08-${{ hashFiles('dist/dependencies.json', 'dist/flatpak/build-dependencies.json', 'dist/resources.json') }}
          restore-keys: |
            flatpak-${{ matrix.arch }}-26.08-
      - name: Build, test and package Linux targets concurrently
        id: release-build
        if: matrix.platform == 'linux' && inputs.release
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          version="$(build/test-env/bin/python dist/release.py "$RELEASE_REF" --require-head)"
          build/test-env/bin/python dist/ci_linux.py --arch "$BUILD_ARCH" --version "$version"
      # Windows builds and tests in the toolchain archive, through the command a developer uses.
      # setup-python only starts tools/ci.py; the toolchain brings the Python the jobs use.
      - uses: actions/setup-python@v5
        if: matrix.platform == 'windows'
        with:
          python-version: '3.13'
      - name: Windows toolchain
        if: matrix.platform == 'windows'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: python tools/ci.py image --windows
      - name: Build Windows
        if: matrix.platform == 'windows'
        run: python tools/ci.py run windows-release --stage build
      - name: Test Windows
        if: matrix.platform == 'windows'
        run: python tools/ci.py run windows-release --stage test
      - name: ZIP, installer and installation lifecycle
        if: matrix.platform == 'windows' && inputs.release
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: python tools/ci.py exec dist/windows/package-release.sh
      - uses: actions/cache/save@v4
        if: always() && !cancelled() && steps.release-cache.outcome == 'success' && steps.release-cache.outputs.cache-hit != 'true' && steps.release-build.outputs.dependencies-ready == 'true'
        with:
          path: |
            build/release-tasks/*/source/build/source-cache
            build/release-tasks/*/source/build/resources
            build/release-tasks/*/source/build/release-deps
          key: ${{ steps.release-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: always() && !cancelled() && steps.flatpak-cache.outcome == 'success' && steps.flatpak-cache.outputs.cache-hit != 'true' && steps.release-build.outputs.flatpak-sdk-ready == 'true'
        with:
          path: |
            ~/.local/share/flatpak
            build/release-tasks/flatpak/source/.flatpak-builder/downloads
          key: ${{ steps.flatpak-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-results-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/**/ci-logs/*
            build/**/Testing/Temporary/**
            build/release-tasks/logs/*
            build/**/coverage/*.html
            build/**/coverage/*.css
            build/**/coverage/*.xml
      - uses: actions/upload-artifact@v4
        if: inputs.release
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/artifacts/*
          if-no-files-found: error

  instrumentation:
    needs: toolchain
    if: ${{ !inputs.release }}
    name: Linux x86_64 (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        variant: [sanitizers, coverage]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Toolchain image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          python3 tools/ci.py image
      - name: Build isolated variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: python3 tools/ci.py run "linux-$VARIANT" --stage build
      # The test stage also analyzes the C paths and writes the coverage report, whatever
      # the tests' result; the scheduled run instruments every scenario and repeats the
      # sensitive ones.
      - name: Test isolated variant
        env:
          VARIANT: ${{ matrix.variant }}
          FULL: ${{ github.event_name == 'schedule' }}
        run: |
          options=()
          if [ "$FULL" = true ]; then options+=(--full); fi
          python3 tools/ci.py run "linux-$VARIANT" --stage test "${options[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-${{ matrix.variant }}
          path: |
            build/**/ci-logs/*
            build/**/Testing/Temporary/**
            build/**/coverage/*.html
            build/**/coverage/*.css
            build/**/coverage/*.xml

  required:
    name: CI required
    if: always()
    needs: [quality, build, instrumentation]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable job to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          BUILD: ${{ needs.build.result }}
          INSTRUMENTATION: ${{ needs.instrumentation.result }}
          RELEASE: ${{ inputs.release }}
        run: |
          test "$QUALITY" = success
          test "$BUILD" = success
          if [ "$RELEASE" = true ]; then
            test "$INSTRUMENTATION" = skipped
          else
            test "$INSTRUMENTATION" = success
          fi
