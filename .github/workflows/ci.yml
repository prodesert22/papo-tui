name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      release:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/quality.py
      - run: python -m unittest discover -s tests/contract -v
      - run: python -m unittest discover -s tests/distribution -v
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: sh dist/linux-deps.sh
      - run: python3 -m venv build/test-env && build/test-env/bin/pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: |
            build/source-cache
            build/resources
            build/release-deps
          key: linux-${{ matrix.runner }}-${{ hashFiles('dist/dependencies.json', 'dist/bootstrap.py', 'dist/resources.json') }}
      - run: build/test-env/bin/python dist/build.py --build build/release --prefix build/release-deps
        env:
          PATH: ${{ github.workspace }}/build/test-env/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - name: Analyze C paths
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get install -y clang-tidy
          build/test-env/bin/python tools/analyze.py --build build/release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-linux-${{ matrix.arch }}
          path: build/release/Testing/Temporary/
  instrumentation:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [sanitizers, coverage]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: sh dist/linux-deps.sh
      - run: python3 -m venv build/test-env && build/test-env/bin/pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: |
            build/source-cache
            build/resources
            build/release-deps
          key: linux-ubuntu-24.04-${{ hashFiles('dist/dependencies.json', 'dist/bootstrap.py', 'dist/resources.json') }}
      - run: build/test-env/bin/python dist/build.py --build build/${{ matrix.mode }} --prefix build/release-deps --${{ matrix.mode }}
        env:
          PATH: ${{ github.workspace }}/build/test-env/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - if: matrix.mode == 'coverage' && always()
        run: build/test-env/bin/gcovr --root . --filter src/ --exclude 'src/model/text/emoji_data.inc' --html-details build/coverage/index.html --xml build/coverage/coverage.xml --print-summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.mode }}-results
          path: |
            build/${{ matrix.mode }}/Testing/Temporary/
            build/coverage/*.html
            build/coverage/*.css
            build/coverage/*.xml
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            system: CLANG64
            package: mingw-w64-clang-x86_64
            arch: x86_64
          - runner: windows-11-arm
            system: CLANGARM64
            package: mingw-w64-clang-aarch64
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.system }}
          update: true
          install: >-
            base-devel git autoconf automake libtool nasm
            ${{ matrix.package }}-toolchain ${{ matrix.package }}-cmake
            ${{ matrix.package }}-ninja ${{ matrix.package }}-pkgconf
            ${{ matrix.package }}-ncurses ${{ matrix.package }}-glib2
            ${{ matrix.package }}-pango ${{ matrix.package }}-fontconfig
            ${{ matrix.package }}-libass ${{ matrix.package }}-libplacebo
            ${{ matrix.package }}-ffmpeg ${{ matrix.package }}-libgcrypt
      - name: Python test environment
        run: |
          native_python="$(cygpath -u "$pythonLocation")/python.exe"
          "$native_python" -m venv build/test-env
          build/test-env/Scripts/python.exe -m pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: |
            build/source-cache
            build/resources
            build/release-deps
          key: windows-${{ matrix.system }}-${{ hashFiles('dist/dependencies.json', 'dist/bootstrap.py', 'dist/resources.json') }}
      - run: |
          export PATH="$PWD/build/test-env/Scripts:$PATH"
          export PAPO_SYSTEM_BIN="$(cygpath -w "$MINGW_PREFIX/bin")"
          python dist/build.py --build build/release --prefix build/release-deps
      - name: ZIP, installer and installation lifecycle
        if: inputs.release
        run: |
          export PATH="$PWD/build/test-env/Scripts:$PATH"
          export ISCC="$(python dist/windows/tools.py | tail -1)"
          version="$(python dist/release.py '${{ inputs.ref }}' --require-head)"
          python dist/package.py --build build/release --output build/artifacts --formats zip,installer \
            --arch '${{ matrix.arch }}' --flavor windows --dependency-prefix build/release-deps
          python dist/windows/verify.py --artifacts build/artifacts --version "$version" --arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        if: inputs.release
        with:
          name: packages-windows-${{ matrix.arch }}
          path: build/artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-windows-${{ matrix.arch }}
          path: build/release/Testing/Temporary/
