name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vMAJOR.MINOR.PATCH)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(python3 dist/release.py "$RELEASE_TAG" --require-head)"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  checks:
    needs: identity
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.identity.outputs.tag }}
      release: true
  publish:
    needs: [identity, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: build/downloads
      - name: Assemble and verify checksums
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          python3 dist/assemble.py build/downloads build/artifacts
          python3 dist/release.py "$RELEASE_TAG" --assets build/artifacts
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            state="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            test "$state" = true || { echo 'Refusing to replace a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" build/artifacts/* --clobber
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md" --draft=false --latest
