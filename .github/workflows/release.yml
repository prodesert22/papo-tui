name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vMAJOR.MINOR.PATCH)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  identity:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.identity.outputs.enabled }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PREVIOUS_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          AUTOMATIC_RELEASE: ${{ github.event_name == 'push' }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            version="$(python3 dist/release.py --changed-since "$PREVIOUS_SHA")"
            if [ -z "$version" ]; then
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            RELEASE_TAG="v$version"
          fi
          git fetch --no-tags origin main
          python3 dist/release.py "$RELEASE_TAG" --require-main
          if state="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$state" = true || { echo 'Refusing to replace a published release'; exit 1; }
          fi
          if [ "$AUTOMATIC_RELEASE" = true ]; then
            version="$(python3 dist/release.py "$RELEASE_TAG" --ensure-tag --require-head --require-main)"
          else
            version="$(python3 dist/release.py "$RELEASE_TAG" --require-head --require-main)"
          fi
          {
            echo 'enabled=true'
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
  checks:
    needs: identity
    if: needs.identity.outputs.enabled == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.identity.outputs.tag }}
      release: true
  publish:
    needs: [identity, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: build/downloads
      - name: Assemble and verify checksums
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          python3 dist/assemble.py build/downloads build/artifacts
          python3 dist/release.py "$RELEASE_TAG" --require-head --assets build/artifacts
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            state="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            test "$state" = true || { echo 'Refusing to replace a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" build/artifacts/* --clobber
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md" --draft=false --latest
